name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project doesn't include a Gradle wrapper jar, so let this action
      # install Gradle directly instead of relying on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgc-giving-admin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
